site_name: aioartemis
site_description: asyncio AMQP 1.0 client for ActiveMQ Artemis with failover across nodes
site_url: https://smirnoffmg.github.io/aioartemis/
repo_url: https://github.com/smirnoffmg/aioartemis

theme:
  name: material

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences  # fenced code inside admonitions

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_if_no_docstring: true
            members_order: source
            show_source: false
            filters: ["!^_", "!^__all__$", "!^__version__$"]

nav:
  - Getting started: index.md
  - Delivery guarantees: guarantees.md
  - Failover and load balancers: failover.md
  - Errors: errors.md
  - API reference: api.md
